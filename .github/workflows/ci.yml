name: CI

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

# A newer push to a PR replaces its run; each run on main has its own group,
# so none is cancelled or replaced while pending.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  LUAU_VERSION: '0.741'

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Luau
        run: |
          curl -fsSL -o /tmp/luau.zip "https://github.com/luau-lang/luau/releases/download/${LUAU_VERSION}/luau-ubuntu.zip"
          mkdir -p "$HOME/.luau/bin" && unzip -q /tmp/luau.zip -d "$HOME/.luau/bin"
          chmod +x "$HOME/.luau/bin/"*
          echo "$HOME/.luau/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: |
          cd plugin || exit 1
          set --
          for f in *.luau; do [ "$f" = tern.d.luau ] || set -- "$@" "$f"; done
          rc=0
          out=$(luau-analyze "$@" 2>&1) || rc=$?
          [ "$rc" -le 1 ] && ! printf '%s\n' "$out" | grep -F '): SyntaxError:'

      - name: Test
        run: |
          cd plugin && luau check.luau | grep -qx 'parse: ok'
